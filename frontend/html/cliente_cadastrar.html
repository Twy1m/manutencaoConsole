<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/cliente_cadastrar.js" defer></script>
    <title>Cadastrar Cliente - PixelFix</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>&emsp;&emsp;
            <a href="./logar.html">Login</a>&emsp;
            <a href="./cliente_cadastrar.html">Criar conta</a>
            <br><br><hr><br>
        </nav>
    </header>
    <main>
        <h1>Cadastrar Cliente</h1>
        <br><br>
        <form>
            <label for="nome">Nome</label><br>
            <input type="text" id="nome" required><br><br>
            <label for="email">E-mail</label><br>
            <input type="email" id="email" required><br><br>
            <label for="senha">Senha</label><br>
            <input type="password" id="senha" required><br><br>
            <label for="cpf">CPF</label><br>
            <input type="text" id="cpf" maxlength="11" placeholder="Somente números" required><br><br>
            <label for="telefone">Telefone celular</label><br>
            <input type="text" id="telefone" maxlength="20" placeholder="Ex: 47912345678" required><br><br>
            <button id="btn_cadastrar">Cadastrar</button><br><br><br>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>
